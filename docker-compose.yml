services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yzschros-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: yzschros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yzschros_dev_2026}
      POSTGRES_DB: yzschros
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'shared_buffers=512MB'
      - '-c'
      - 'work_mem=32MB'
      - '-c'
      - 'effective_cache_size=1536MB'
      - '-c'
      - 'maintenance_work_mem=128MB'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'max_connections=100'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yzschros']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: yzschros-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: yzschros-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinerU PDF → Markdown 微服务
  mineru:
    image: opendatalab/mineru:latest
    container_name: yzschros-mineru
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - MINERU_DEVICE=cpu
      - MINERU_PARSE_METHOD=auto
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
